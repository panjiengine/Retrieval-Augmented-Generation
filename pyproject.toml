[project]
name = "retrieval-augmented-generation"
version = "0.1.0"
description = "Retrieval-Augmented Generation over PDF documents, exposed as a Model Context Protocol (MCP) server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "jupyter>=1.1.1",
    "mcp>=1.10",
    "notebook>=7.6.3",
    "numpy>=2.5.4",
    "pymupdf>=1.28.2",
    "pyngrok>=8.1.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
retrieval-augmented-generation = "retrieval_augmented_generation:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
